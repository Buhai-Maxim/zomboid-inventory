<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Zomboid Inventory Front-End</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-8">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [items, setItems] = React.useState([]);

            React.useEffect(() => {
                fetch('http://127.0.0.1:8000/items?size=50')
                    .then(res => res.json())
                    .then(data => setItems(data.items))
                    .catch(err => console.error("Помилка завантаження:", err));
            }, []);

            return (
                <div className="max-w-3xl mx-auto">
                    <h1 className="text-3xl font-bold mb-6 text-red-500">🧟 Zomboid Accounting System</h1>
                    <div className="bg-gray-800 shadow-md rounded-lg overflow-hidden border border-gray-700">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-700 text-gray-300">
                                    <th className="p-3">ID</th>
                                    <th className="p-3">Назва</th>
                                    <th className="p-3">Тип</th>
                                    <th className="p-3">Стан</th>
                                    <th className="p-3">Кількість</th>
                                </tr>
                            </thead>
                            <tbody>
                                {items.map((item, index) => (
                                    <tr key={index} className="border-t border-gray-700 hover:bg-gray-750">
                                        <td className="p-3">{item.ID}</td>
                                        <td className="p-3 font-semibold">{item.Name}</td>
                                        <td className="p-3 text-gray-400">{item.Type}</td>
                                        <td className="p-3">
                                            <span className={`px-2 py-1 rounded text-xs ${
                                                item.Condition === 'Mint' ? 'bg-green-800 text-green-200' : 
                                                item.Condition === 'New' ? 'bg-purple-800 text-purple-200' : 
                                                item.Condition === 'Good' ? 'bg-blue-800 text-blue-200' : 
                                                'bg-red-800 text-red-200'
                                            }`}>
                                                {item.Condition}
                                            </span>
                                        </td>
                                        <td className="p-3">{item.Amount}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
